experiment_name: "NIH_MultiClass_Accuracy"

data:
  manifest: "data/nih_multiclass_manifest.csv"
  image_root: "data/archive"
  image_size: 224
  num_classes: 15
  multilabel_classes: 14

model:
  backbone: "resnet50"
  pretrained: true
  auxiliary_loss_weight: 0.25

train:
  seed: 42
  batch_size: 16
  learning_rate: 0.0001
  head_learning_rate: 0.001
  epochs: 5
  amp: false
  class_weight_clip: [1.0, 1.0]
  auxiliary_loss: "bce_pos_weight"
  save_dir: "checkpoints/multiclass_acc"

evaluation:
  split: "test"
  primary_metric: "accuracy"
  multilabel_threshold_source: "validation"
